<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DE LA CAL · Futebol</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f4eb;color:#183c30;font:1rem/1.5 Inter,system-ui,sans-serif}header{background:#123d30;color:white;border-bottom:6px solid #a7e462}header div,main{max-width:960px;margin:auto;padding:24px}header a{color:#cef495}h1{font-size:clamp(3rem,8vw,5rem);line-height:1;margin:16px 0;letter-spacing:-.07em}a{color:#226044}nav,.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0}button,select,input{font:inherit;padding:7px 10px;border:1px solid #889d90;border-radius:6px;background:white;color:#173c30}button{cursor:pointer}button[aria-current=true]{background:#173c30;color:white}article{background:white;border-radius:10px;padding:12px 18px;margin:12px 0}article>a{display:block;padding:9px 0;border-top:1px solid #dae1d8;text-decoration:none}article>a:hover{text-decoration:underline}table{border-collapse:collapse;width:100%}th,td{padding:6px;text-align:left;border-bottom:1px solid #ddd}h2,h3{line-height:1.2}small{color:#52675c}#view{overflow-wrap:anywhere}label{display:inline-flex;gap:6px;align-items:center}</style>
<header><div><a href="../">← Projetos Nakataff</a><h1>DE LA CAL</h1><p>Brasil, América e Europa · Temporada 2026 / 2026–27</p></div></header><main><div class="controls"><label>Competição <select id="league"></select></label></div><nav aria-label="Futebol"></nav><div id="view" aria-live="polite"></div></main><script>
const leagues={'bra.1':'Brasileirão Série A','bra.2':'Brasileirão Série B','conmebol.libertadores':'Libertadores','uefa.champions':'Champions League','eng.1':'Premier League','esp.1':'La Liga','ita.1':'Serie A italiana'};
const tabs={home:'Jogos e resultados',calendar:'Calendário',table:'Classificação',clubs:'Clubes',leaders:'Artilharia'};
const api='https://site.api.espn.com/apis/';
const tz='America/Sao_Paulo', view=document.querySelector('#view'), league=document.querySelector('#league');
const dateBR=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:tz}).format(new Date(d));
let selectedDate=dateBR(Date.now()),version=0;
const cache=new Map();
function el(tag,txt,parent=view){const n=document.createElement(tag);n.textContent=txt;parent.append(n);return n}
function link(label,url,parent){const a=el('a',label,parent);a.href=url;return a}
function route(tab,l,id=''){return '#'+[tab,l,id].join('/')}
async function json(url){const old=cache.get(url);if(old&&Date.now()-old.time<60000)return old.data;
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
 try{const r=await fetch(url,{signal:controller.signal});if(!r.ok)throw Error();const data=await r.json();cache.set(url,{time:Date.now(),data});return data}finally{clearTimeout(timer)}}
const base=l=>api+'site/v2/sports/soccer/'+l+'/';
function range(l){return ['eng.1','esp.1','ita.1','uefa.champions'].includes(l)?['20260701','20270630']:['20260101','20261231']}
function dayOffset(day,n){const d=new Date(day+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10).replaceAll('-','')}
function score(x){return x?.score?.displayValue??x?.score??'–'}
function title(c){const teams=c.competitors||[],a=teams.find(x=>x.homeAway==='home'),b=teams.find(x=>x.homeAway==='away');return [a?.team.displayName,c.status?.type?.state==='pre'?'×':score(a)+' × '+score(b),b?.team.displayName].join(' ')}
for(const [id,name] of Object.entries(leagues))league.add(new Option(name,id));
league.onchange=()=>{location.hash=route('calendar',league.value)};
async function render(){const token=++version;let [tab,l,id]=location.hash.slice(1).split('/');if(!leagues[l])l='bra.1';if(!tabs[tab]&&!['match','club','player'].includes(tab))tab='home';
league.value=l;const nav=document.querySelector('nav');nav.replaceChildren();for(const [key,name] of Object.entries(tabs)){const b=el('button',name,nav);b.setAttribute('aria-current',String(tab===key));b.onclick=()=>{location.hash=route(key,l)}}
view.replaceChildren();el('h2',tab==='home'?'Jogos perto de hoje':tabs[tab]||({match:'Raio-X do confronto',club:'Clube',player:'Jogador'})[tab]);const area=el('div','');const wait=el('p','Carregando dados…',area);
try{if(tab==='home'||tab==='calendar'){const home=tab==='home';let date=selectedDate;if(!home){const label=el('label','Data de referência ',area);const picker=el('input','',label);picker.type='date';picker.value=date;picker.onchange=()=>{if(picker.value){selectedDate=picker.value;render()}}}else date=dateBR(Date.now());
const ids=home?Object.keys(leagues):[l];await Promise.all(ids.map(async code=>{const box=el('article','',area);el('h3',leagues[code],box);const [start,end]=range(code),from=dayOffset(date,home?-2:-7),to=dayOffset(date,home?2:7);if(to<start||from>end){el('p','Fora da temporada selecionada.',box);return}
try{const data=await json(base(code)+'scoreboard?limit=150&dates='+[from<start?start:from,to>end?end:to].join('-'));for(const e of data.events||[]){const c=e.competitions[0];const when=new Date(e.date).toLocaleString('pt-BR',{timeZone:tz,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});link(when+' · '+title(c)+' · '+({pre:'Agendado',in:'Em andamento',post:'Encerrado'}[e.status?.type?.state]||''),route('match',code,e.id),box)}if(!data.events?.length)el('p','Sem partidas neste período.',box)}catch{el('p','Consulta indisponível.',box);link('Ver jogos na ESPN','https://www.espn.com.br/futebol/resultados/_/liga/'+code,box)}}));}
else if(tab==='table'){const data=await json(api+'v2/sports/soccer/'+l+'/standings?season=2026');let count=0;function group(g){const rows=g.standings?.entries;if(rows?.length){count++;const box=el('article','',area);el('h3',g.name||leagues[l],box);const table=el('table','',box),head=el('tr','',table);for(const t of ['#','Clube','Pts','J','V','SG'])el('th',t,head);for(const row of rows){const tr=el('tr','',table);const stat=k=>row.stats.find(s=>s.name===k)?.displayValue??'–';el('td',stat('rank'),tr);link(row.team.displayName,route('club',l,row.team.id),el('td','',tr));for(const k of ['points','gamesPlayed','wins','pointDifferential'])el('td',stat(k),tr)}}for(const child of g.children||[])group(child)}group(data);if(!count)el('p','Tabela indisponível para esta fase.',area)}
else if(tab==='clubs'){const data=await json(base(l)+'teams?limit=200&season=2026');const box=el('article','',area);for(const t of data.sports?.[0]?.leagues?.[0]?.teams||[])link(t.team.displayName,route('club',l,t.team.id),box);if(!box.children.length)el('p','Lista de clubes indisponível.',box)}
else if(tab==='club'){const [d,r]=await Promise.all([json(base(l)+'teams/'+encodeURIComponent(id)),json(base(l)+'teams/'+encodeURIComponent(id)+'/roster?season=2026').catch(()=>({}))]);el('h3',d.team.displayName,area);const box=el('article','',area);el('h3','Elenco',box);for(const a of (r.athletes||[]).flatMap(a=>a.items||[a]))if(a.id)link(a.displayName+' · '+(a.position?.abbreviation||''),route('player',l,a.id),box);if(box.children.length===1)el('p','Elenco indisponível.',box)}
else if(tab==='player'){const a=await json('https://sports.core.api.espn.com/v2/sports/soccer/leagues/'+l+'/seasons/2026/athletes/'+encodeURIComponent(id));el('h3',a.displayName,area);for(const s of [a.position?.displayName,a.citizenship,a.displayHeight,a.displayWeight])if(s)el('p',s,area);link('Perfil completo na ESPN','https://www.espn.com.br/futebol/jogador/_/id/'+encodeURIComponent(id),area)}
else if(tab==='leaders'){el('h3',leagues[l],area);link('Abrir artilharia e assistências da temporada na ESPN ↗','https://www.espn.com.br/futebol/estatisticas/_/liga/'+l+'/temporada/2026',area)}
else if(tab==='match'){const d=await json(base(l)+'summary?event='+encodeURIComponent(id)),c=d.header.competitions[0];el('h3',title(c),area);el('p',[dateBR(c.date),d.gameInfo?.venue?.fullName].filter(Boolean).join(' · '),area);for(const team of c.competitors)link(team.team.displayName+' ',route('club',l,team.team.id),area);for(const t of d.boxscore?.teams||[]){const box=el('article','',area);el('h3',t.team.displayName,box);for(const s of t.statistics||[])el('p',(s.label||s.displayName||s.name)+' · '+s.displayValue,box)}for(const e of d.keyEvents||[])if(e.text)el('p',(e.clock?.displayValue||'')+' '+e.text,area);const f=el('label','Sua nota ',area),pick=el('select','',f);pick.add(new Option('Escolha',''));for(let i=0;i<=10;i++)pick.add(new Option(i,i));const key='de-la-cal:'+l+':2026:'+id;try{pick.value=localStorage.getItem(key)||''}catch{}const msg=el('output','',area);pick.onchange=()=>{try{if(pick.value==='')localStorage.removeItem(key);else localStorage.setItem(key,pick.value);msg.textContent=' Avaliação atualizada.'}catch{msg.textContent=' Falha ao salvar.'}}}
}catch{el('p','Não foi possível carregar os dados agora.',area);if(tab==='player')link('Perfil na ESPN','https://www.espn.com.br/futebol/jogador/_/id/'+encodeURIComponent(id),area)}finally{wait.remove()}}
window.addEventListener('hashchange',render);render();
</script></html>
