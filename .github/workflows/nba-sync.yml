name: Atualizar dados NBA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_nba.py'
      - '.github/workflows/nba-sync.yml'
  schedule:
    # 21h–06h BRT: reforçar partidas noturnas e finais sem processar elencos.
    - cron: '17,47 0-8 * * *'
    # Sincronização completa de manhã/tarde e antes da rodada.
    - cron: '17 11,17,23 * * *'
permissions:
  contents: write
concurrency:
  group: nba-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Importar calendário, elencos e resultados finais
        env:
          NBA_SYNC_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '17,47 0-8 * * *' && 'recent' || 'full' }}
        run: python scripts/sync_nba.py
      - name: Publicar somente dados modificados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p nba/data
          git add nba/data/
          if ! git diff --cached --quiet; then
            git commit -m "data(nba): atualizar calendário, elencos e estatísticas"
            git push
          fi
