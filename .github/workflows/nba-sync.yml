name: Atualizar dados NBA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_nba.py'
      - '.github/workflows/nba-sync.yml'
  schedule:
    # Cache recente a cada meia hora, inclusive após a rodada e de manhã.
    # GitHub pode atrasar o cron; a página também recupera finais diretamente.
    - cron: '17,47 * * * *'
    # Elencos e calendário completo apenas duas vezes ao dia (08h e 17h BRT).
    - cron: '23 11,20 * * *'
permissions:
  contents: write
concurrency:
  group: nba-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar consolidação dos resultados
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Importar calendário, elencos e resultados finais
        env:
          NBA_SYNC_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '17,47 * * * *' && 'recent' || 'full' }}
        run: python scripts/sync_nba.py
      - name: Publicar somente dados modificados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p nba/data
          git add nba/data/
          if ! git diff --cached --quiet; then
            git commit -m "data(nba): atualizar calendário, elencos e estatísticas"
            # Commits de código podem entrar na main enquanto o sync consulta
            # a ESPN. Rebase preserva os commits mais novos antes do envio.
            published=false
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                published=true
                break
              fi
              sleep 3
            done
            if [ "$published" != true ]; then
              echo "::error::Não foi possível publicar após 3 tentativas"
              exit 1
            fi
          fi
