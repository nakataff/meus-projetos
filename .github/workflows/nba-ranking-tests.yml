name: Test NBA automatic rankings
on:
  push:
    paths:
      - 'nba/js/live.js'
      - 'nba/js/pages/leaders.js'
      - 'nba/js/entry.js'
      - 'nba/test/**'
      - 'scripts/sync_nba.py'
      - 'scripts/tests/**'
      - '.github/workflows/nba-ranking-tests.yml'
  pull_request:
    paths:
      - 'nba/js/live.js'
      - 'nba/js/pages/leaders.js'
      - 'nba/test/**'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  rankings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test runtime
        run: npm install --prefix /tmp/nba-ranking-tests --no-save --no-audit --no-fund jsdom@26.1.0
      - name: Test automatic final results, stat corrections and round filters
        env:
          NODE_PATH: /tmp/nba-ranking-tests/node_modules
        run: node --test nba/test/ranking-auto.test.cjs
      - name: Test final boxscore import and data preservation
        run: python -m unittest discover -s scripts/tests -v
      - name: Check shared browser scripts
        run: node --check nba/js/live.js && node --check nba/js/pages/leaders.js && node --check nba/js/entry.js
