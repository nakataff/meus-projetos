name = "de-la-quadra-alertas"
main = "worker.mjs"
compatibility_date = "2026-11-08"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_URL = "https://nakataff.github.io/meus-projetos/nba/"

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "ALERTS"
class_name = "AlertStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlertStore"]
